# Render blueprint for both halves: the FastAPI backend and the Next.js frontend.
#
# Two things about the free tier that matter here:
#
# 1. Chroma downloads all-MiniLM-L6-v2 (~79MB) on first use and builds the index from
#    data/incidents/. The disk is ephemeral, so that happens again after every cold start, and
#    the first run after one is slower. (A preDeployCommand could warm it, but Render only
#    allows those on paid plans.)
# 2. Free instances sleep after inactivity and cold-start slowly. A demo link that has been idle
#    will take ~30s to answer its first request before any agent has run.
services:
  - type: web
    name: oncall-support-agent-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: GROQ_API_KEY
        sync: false          # set in the Render dashboard; never committed
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # the Vercel URL, once it exists

  # The frontend, as a static site: Next builds it to plain files in out/ (output: "export"),
  # which Render serves free from its CDN. Static sites never sleep; only the API above does.
  - type: web
    name: oncall-support-agent
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: out
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false          # the API's URL above; baked in at build time
